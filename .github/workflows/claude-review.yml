name: Claude review

# The gate and review jobs live in commercial-breaker's claude-review-reusable.yml.
# Outside that repo, pin `uses:` to
#   npHavens/commercial-breaker/.github/workflows/claude-review-reusable.yml@<full SHA>
# When moving that pin:
#   1. Confirm the SHA is on commercial-breaker's main, because GitHub can resolve a fork's
#      commit under that repo's name. Run the command below; it must print identical or ahead.
#      On behind or diverged, stop.
#        gh api repos/npHavens/commercial-breaker/compare/<sha>...main --jq .status
#   2. Check the triggers, permissions and job-level if: against commercial-breaker's caller at
#      that SHA.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Skips bots and non-collaborators cheaply; the called gate owns the trigger phrase.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || (github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # The called workflow's token cannot exceed these.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/claude-review-reusable.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
