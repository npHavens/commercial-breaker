name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The offline suites from the README. Fake workers and synthetic audio only: no secrets, no uploads.
jobs:
  scripts:
    name: JavaScript and Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 --version && python3 -m unittest discover -s Tests -p 'test_*.py'

  native:
    name: Native build and tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build the app unsigned
        run: >-
          xcodebuild -project SkyboxProbe.xcodeproj -scheme SkyboxAudioProbe
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build
      - run: Tests/run-native-tests.sh
