<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save Commercial Breaker recording</title>
  <script src="export.js" defer></script>
  <script src="save-recording.js" defer></script>
</head>
<body>
  <h1>Save Commercial Breaker recording</h1>
  <p id="message" role="status">Loading the recording…</p>
  <p><a id="download" hidden>Download JSON</a></p>

  <p>If the download link fails, <a id="open" hidden target="_blank" rel="noopener">open the JSON</a> and use Safari’s File → Save As to save it.</p>
  <button id="clear" disabled>Clear saved recovery copy</button>
</body>
